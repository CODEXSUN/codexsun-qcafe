map $http_authorization $os_authorization {
    default $http_authorization;
    "" "Bearer $cookie_os_access";
}
map "$request_method:$http_origin" $os_bad_origin {
    default 1;
    ~^(GET|HEAD|OPTIONS): 0;
    ~^[A-Z]+:$ 0;
    ~^[A-Z]+:https://os\.codexsun\.com$ 0;
    ~^[A-Z]+:https?://tauri\.localhost$ 0;
    ~^[A-Z]+:tauri://localhost$ 0;
}
map $http_origin $os_cors_origin {
    default "";
    "https://os.codexsun.com" $http_origin;
    "http://tauri.localhost" $http_origin;
    "https://tauri.localhost" $http_origin;
    "tauri://localhost" $http_origin;
}
limit_req_zone $binary_remote_addr zone=signin:10m rate=5r/m;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream os_platform { zone os_platform 64k; server platform:4100 resolve; }
upstream os_zetro { zone os_zetro 64k; server zetro:4150 resolve; }
upstream os_chat { zone os_chat 64k; server chat:4165 resolve; }
upstream os_chat_ws { zone os_chat_ws 64k; server chat:4166 resolve; }
upstream os_dcs { zone os_dcs 64k; server dcs:4170 resolve; }
upstream os_files { zone os_files 64k; server files:80 resolve; }
server {
    listen 80;
    server_name os.codexsun.com;
    root /usr/share/nginx/html;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Access-Control-Allow-Origin $os_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;
    if ($os_bad_origin) { return 403; }
    if ($request_method = OPTIONS) { return 204; }
    proxy_set_header Host $host;
    proxy_set_header Authorization $os_authorization;
    proxy_read_timeout 180s;
    location = /health { default_type application/json; return 200 '{"service":"os-codexsun-web","status":"ok"}'; }
    location = /api/v1/identity/login {
        limit_req zone=signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://os_platform;
    }
    location = /api/v1/identity/setup {
        limit_req zone=signin burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://os_platform;
    }
    location /api/v1/identity/ { proxy_pass http://os_platform; }
    location = /api/v1/core { auth_request /_session; proxy_pass http://os_platform; }
    location /api/v1/apps/ { proxy_pass http://os_platform; }
    location /api/v1/zetro/ { proxy_pass http://os_zetro; proxy_buffering off; }
    location /api/v1/ai-tasks { proxy_pass http://os_zetro; }
    location /api/v1/chat/ { proxy_pass http://os_chat; }
    location = /dcs/ws {
        proxy_pass http://os_dcs/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 90s;
        access_log off;
    }
    location /dcs/ { proxy_pass http://os_dcs/; }
    location = /chat/ws {
        proxy_pass http://os_chat_ws/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        access_log off;
    }
    location = /_session {
        internal;
        proxy_pass http://os_platform/api/v1/identity/installation;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $os_authorization;
    }
    location /files/ {
        auth_request /_session;
        auth_request_set $os_login $upstream_http_x_os_login;
        proxy_set_header X-Remote-User $os_login;
        proxy_set_header Authorization "";
        proxy_pass http://os_files;
    }
    location /api/ { default_type application/json; return 404 '{"error":"Unknown application API"}'; }
    location / { try_files $uri $uri/ /index.html; }
}
